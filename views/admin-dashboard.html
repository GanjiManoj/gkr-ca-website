<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | GKR & Co.</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    h1 {
      color: #38bdf8;
      margin: 0;
      font-size: 1.75rem;
    }
    h2 {
      color: #38bdf8;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      font-size: 1.35rem;
    }
    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .add-case-btn {
      background: #38bdf8;
      color: #0f172a;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }
    .add-case-btn:hover {
      background: #7dd3fc;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
    }
    .logout-btn:hover {
      background: #ef4444;
      color: #fff;
    }
    .table-container {
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      overflow-x: auto;
      margin-bottom: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: #1e3a8a;
      color: #f8fafc;
      padding: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
    }
    td {
      padding: 1rem;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    tr:last-child td {
      border-bottom: none;
    }
    a.phone-link {
      color: #38bdf8;
      text-decoration: underline;
    }
    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .delete-btn:hover {
      background: #ef4444;
      color: #fff;
    }
    .no-data {
      text-align: center;
      padding: 2rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Admin Control Dashboard</h1>
    <div class="header-actions">
      <a href="/admin/add-case-study" class="add-case-btn">+ Add Case Study</a>
      <a href="/admin/logout" class="logout-btn">Logout</a>
    </div>
  </div>

  <h2>Client Enquiries</h2>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Client Name</th>
          <th>Phone</th>
          <th>Message</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="enquiriesTable">
        <tr><td colspan="5" class="no-data">Loading enquiries...</td></tr>
      </tbody>
    </table>
  </div>

  <h2>Published Case Studies</h2>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Title</th>
          <th>Description Preview</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="caseStudiesTable">
        <tr><td colspan="4" class="no-data">Loading case studies...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadEnquiries() {
      try {
        const res = await fetch('/api/admin/enquiries');
        if (!res.ok) throw new Error('Unauthorized');

        const enquiries = await res.json();
        const tbody = document.getElementById('enquiriesTable');

        if (enquiries.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="no-data">No enquiries found.</td></tr>';
          return;
        }

        tbody.innerHTML = enquiries.map(item => `
          <tr>
            <td>${item.date || new Date(item.createdAt).toLocaleString()}</td>
            <td><strong>${item.name}</strong></td>
            <td><a href="tel:${item.phone}" class="phone-link">${item.phone}</a></td>
            <td>${item.message}</td>
            <td>
              <button class="delete-btn" onclick="deleteEnquiry('${item._id}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        window.location.href = '/admin/login';
      }
    }

    async function loadCaseStudies() {
      try {
        const res = await fetch('/api/case-studies');
        const studies = await res.json();
        const tbody = document.getElementById('caseStudiesTable');

        if (studies.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="no-data">No case studies published yet.</td></tr>';
          return;
        }

        tbody.innerHTML = studies.map(item => `
          <tr>
            <td>${new Date(item.createdAt).toLocaleDateString()}</td>
            <td><strong>${item.title}</strong></td>
            <td>${item.description.length > 80 ? item.description.substring(0, 80) + '...' : item.description}</td>
            <td>
              <button class="delete-btn" onclick="deleteCaseStudy('${item._id}')">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Failed to load case studies:', err);
      }
    }

    async function deleteEnquiry(id) {
      if (!confirm('Are you sure you want to delete this enquiry permanently?')) return;
      try {
        const res = await fetch(`/api/admin/enquiry/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) loadEnquiries();
        else alert('Failed to delete item');
      } catch (err) {
        alert('Error connecting to server');
      }
    }

    async function deleteCaseStudy(id) {
      if (!confirm('Are you sure you want to delete this case study?')) return;
      try {
        const res = await fetch(`/api/admin/case-studies/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) loadCaseStudies();
        else alert('Failed to delete case study');
      } catch (err) {
        alert('Error connecting to server');
      }
    }

    loadEnquiries();
    loadCaseStudies();
  </script>
</body>
</html>
