<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Case Study | GKR & Co.</title>
  <style>
    body { 
      background: #0f172a; 
      color: #f8fafc; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 1rem; 
    }
    .card { 
      background: #1e293b; 
      padding: 2rem; 
      border-radius: 12px; 
      border: 1px solid #334155; 
      width: 100%; 
      max-width: 550px; 
    }
    h2 { 
      color: #38bdf8; 
      margin-top: 0;
      margin-bottom: 1.5rem; 
      text-align: center; 
    }
    .form-group { 
      margin-bottom: 1.25rem; 
    }
    label { 
      display: block; 
      color: #94a3b8; 
      font-size: 0.85rem; 
      margin-bottom: 0.4rem; 
    }
    input, textarea { 
      width: 100%; 
      padding: 0.75rem; 
      background: #0f172a; 
      border: 1px solid #334155; 
      border-radius: 6px; 
      color: #fff; 
      box-sizing: border-box; 
      outline: none; 
      font-family: inherit;
    }
    input:focus, textarea:focus { 
      border-color: #38bdf8; 
    }
    textarea { 
      height: 140px; 
      resize: vertical; 
    }
    button { 
      width: 100%; 
      padding: 0.75rem; 
      background: #38bdf8; 
      border: none; 
      font-weight: bold; 
      border-radius: 6px; 
      cursor: pointer; 
      color: #0f172a; 
      font-size: 1rem; 
      transition: background-color 0.2s;
    }
    button:hover { 
      background: #7dd3fc; 
    }
    .back-btn { 
      color: #38bdf8; 
      text-decoration: none; 
      display: inline-block; 
      margin-bottom: 1rem; 
      font-size: 0.9rem; 
    }
    .status { 
      margin-bottom: 1rem; 
      padding: 0.65rem; 
      border-radius: 6px; 
      display: none; 
      text-align: center; 
      font-size: 0.85rem; 
    }
    .success { 
      background: rgba(34, 197, 94, 0.2); 
      border: 1px solid #22c55e; 
      color: #86efac; 
    }
    .error { 
      background: rgba(239, 68, 68, 0.2); 
      border: 1px solid #ef4444; 
      color: #fca5a5; 
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="/admin/dashboard" class="back-btn">← Back to Dashboard</a>
    <h2>Add New Case Study</h2>
    <div id="statusMsg" class="status"></div>
    <form id="caseStudyForm">
      <div class="form-group">
        <label for="title">Case Study Title</label>
        <input type="text" id="title" required placeholder="e.g. Corporate Tax Restructuring">
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" required placeholder="Detail the challenge, solution, and outcome..."></textarea>
      </div>
      <button type="submit" id="submitBtn">Publish Case Study</button>
    </form>
  </div>

  <script>
    document.getElementById('caseStudyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');
      
      statusMsg.style.display = 'none';
      submitBtn.disabled = true;

      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();

      try {
        const res = await fetch('/api/admin/case-studies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          statusMsg.className = 'status success';
          statusMsg.textContent = data.message;
          document.getElementById('caseStudyForm').reset();
        } else {
          statusMsg.className = 'status error';
          statusMsg.textContent = data.error || 'Failed to save case study';
          
          // Redirect to login if unauthorized
          if (res.status === 401) {
            setTimeout(() => {
              window.location.href = '/admin/login';
            }, 1500);
          }
        }
      } catch (err) {
        statusMsg.className = 'status error';
        statusMsg.textContent = 'Server connection error. Try again.';
      } finally {
        submitBtn.disabled = false;
        statusMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
