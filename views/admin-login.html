<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Admin Login | GKR & Co.</title>
  
  <!-- Shared Stylesheet -->
 <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .login-card {
      background: var(--bg-card);
      padding: 2.5rem 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }

    .login-card h2 {
      color: var(--accent-blue);
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 1.5rem;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
    }

    button:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Site Navigation -->
  <header>
    <div class="container">
      <nav>
        <a href="/" class="logo">GKR & Co. <span>Chartered Accountants</span></a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
        <ul class="nav-links" id="navLinks">
          <li><a href="/#services">Services</a></li>
          <li><a href="/#profile">About</a></li>
          <li><a href="/case-studies">Case Studies</a></li>
          <li><a href="/#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Login Main Content -->
  <main class="login-wrapper">
    <div class="login-card">
      <h2>Admin Login</h2>
      
      <div id="errorMessage" class="error-msg"></div>

      <form id="loginForm">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="username" style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500;">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password" style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500;">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="submitBtn" class="btn" style="width: 100%; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600;">Sign In</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 GKR & Co, Chartered Accountants. All rights reserved.</p>
    </div>
  </footer>

  <!-- Mobile Nav Script & Login Handler -->
  <script>
    // Navigation Drawer Toggle
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      navLinks.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!menuToggle.contains(e.target) && !navLinks.contains(e.target)) {
        navLinks.classList.remove('active');
      }
    });

    // Form submission
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/admin/dashboard';
        } else {
          errorDiv.textContent = data.error || 'Invalid admin credentials';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Server connection failed. Please try again.';
        errorDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
